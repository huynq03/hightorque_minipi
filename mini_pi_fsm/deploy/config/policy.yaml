# Policy runtime configuration.
#
# WHICH policy package to load is declared per FSM state, in fsm.yaml:
#     FSM.Velocity.policy_dir: config/policy/velocity
# This file holds the runtime and safety settings around that choice.

policy:
  # The FSM state whose policy_dir this runner prepares. Must name a state
  # whose `type` is RLBase in fsm.yaml.
  state: Velocity

  # Pin an exact version directory, e.g. "v0". Empty means "the
  # lexicographically last directory that is a valid package".
  version: ""

  # ======================== THE TEST-POLICY GATE ===========================
  # A policy package whose deploy.yaml declares `simulation_only: true` is a
  # TEST FIXTURE, not a trained policy. Loading one requires BOTH:
  #
  #   1. this flag, and
  #   2. a simulation hardware backend (backend: sim).
  #
  # The second condition cannot be satisfied by configuration while the real
  # HighTorque backend is selected, so a test policy cannot reach real motors
  # even if this flag is left on by mistake.
  #
  # KEEP THIS FALSE. The simulation launch turns it on explicitly:
  #     roslaunch mini_pi_fsm mini_pi_fsm.launch backend:=sim test_policy:=true
  # =========================================================================
  allow_test_policy: false
