# Mini-Pi runtime configuration.
#
# The hardware description itself (serial ports, CAN layout, motor ids,
# control_type) is NOT duplicated here: livelybot_serial::robot reads it from
# the ROS parameter server, where the launch file loads
#   sim2real/robot_param/12dof_STM32H730_pi_lubancat_params.yaml
# That file is the single source of truth for the transport layer.

# ---- hardware backend ------------------------------------------------------
# Which robot sits under the FSM. This is the ONLY switch that differs between
# a real run and a simulated run; the FSM, the states, JointMapper and
# Safety are the same code and the same config in both cases.
#
#   hightorque : livelybot_serial -> the physical Mini-Pi motors.
#   sim        : the UDP low-level bus -> mini_pi_mujoco -> MuJoCo.
#                See doc/simulation.md.
#
# Overridable from the launch file (`backend:=sim`), which is the normal way.
backend: hightorque

# Endpoints of the simulated low-level bus. Ignored unless backend == sim, and
# they must agree with simulate/robots/mini_pi/config.yaml. Defaults are loopback; the
# simulator and the controller are expected to run on the same machine, as
# Unitree's `interface: "lo"` default assumes too.
sim_backend:
  bridge_ip: "127.0.0.1"
  lowcmd_port: 21001      # bridge listens here for LowCmd
  lowstate_port: 21002    # this process listens here for LowState
  # Startup grace period for the first LowState packet. Cosmetic only: the
  # `startup:` readiness wait below holds the FSM until feedback is actually
  # fresh regardless.
  wait_for_bridge_s: 5.0

# ---- startup readiness -----------------------------------------------------
# Checked BEFORE CtrlFSM is started, by FSM/SystemReadiness.h. Until every
# condition holds, main() waits and reports why; NOTHING is transmitted to the
# motors, and no safety fault is recorded -- "not ready yet" is not "faulted".
# This replaces the former `FSM.Init` state, with the same checks.
#
# The required signals, all verified against what the backends can actually
# answer (see include/SystemReadiness.h):
#   * hardware backend initialized, reporting exactly 12 motors, not in Fault
#   * JointMapper loaded and its map_index a valid unique permutation
#   * every one of the 12 motors has produced a finite frame newer than
#     require_fresh_s, with motor_back_t::fault == 0
#   * a finite, unit-norm IMU quaternion newer than
#     min(require_fresh_s, safety.yaml imu_timeout_s)
#     (only when require_imu is true)
# The policy package is deliberately NOT required: a missing policy leaves
# RLPolicyRunner in POLICY_NOT_CONFIGURED and only makes the RL state unreachable.
startup:
  require_imu: true
  # An UPPER bound, never a relaxation. Readiness is always at least as strict
  # as the runtime checks, otherwise the FSM would start and Safety
  # would latch a timeout on its first cycle for the same snapshot:
  #   motors : bounded by safety.yaml motor_timeout_s (0.1 s), because
  #            readiness and Safety both read `stale_motor_count`
  #   IMU    : bounded by min(this, safety.yaml imu_timeout_s) = 0.2 s
  # So raising this number cannot make startup accept a state that runtime
  # would immediately reject; lowering it below a runtime bound still applies.
  require_fresh_s: 0.5
  # 0 == wait forever, which is what Unitree's wait_for_connection() does.
  # A positive value makes main() exit instead of starting the FSM.
  timeout_s: 0.0
  poll_dt_s: 0.02

# Dry-run is the default. Nothing is ever transmitted to the motors while it is
# true: read(), JointMapper, the FSM, Safety and the policy all still run.
dry_run: true

# Control-loop rate of the FSM thread.
# Evidence: sim2real/config/walk/lr.yaml declares `pd_ctrl_f: 1000`, i.e. the
# HighTorque low-level loop also runs at 1 kHz on this robot.
control_hz: 1000.0

# Status dump rate (0 disables).
debug_hz: 1.0

# ---- IMU mounting ------------------------------------------------------------
# Orientation of the IMU SENSOR frame expressed in the robot BASE frame, ZYX
# euler [roll, pitch, yaw] in radians. The controller converts the sensor's
# quaternion and gyro into the base frame with it (Types.h apply_imu_mount).
#
# HARDWARE-UNVERIFIED. [0, 0, 0] (identity) is a PLACEHOLDER, not a measurement.
# The only hint in the vendor tree is `imu_dir: false` in the lubancat robot
# params, whose use in livelybot robot::imu_limt() suggests roll reads ~+-pi
# when upright, i.e. possibly mounted upside down -- that code path is disabled
# on this robot (imu_limt_flag: false), so it proves nothing. MEASURE it in the
# dry-run checklist (robot upright: base rpy must read ~[0, 0, *]) and only
# then set this. Backend `sim` ignores it (the simulated IMU is the base).
imu:
  mount_rpy: [0.0, 0.0, 0.0]

# ---- hightorque backend -------------------------------------------------------
# Motor feedback on the livelybot bus is REQUEST-DRIVEN: a motor replies to a
# frame, it does not stream (see livelybot_bringup motor_feedback.cpp, which
# sends a state query and then keeps re-sending it). With no command going out
# -- the readiness wait, and ALL of a dry run -- the backend therefore sends a
# read-only state query every `feedback_query_period_s`. It carries no target
# and cannot move a motor.
#   "state2"  MODE_MOTOR_STATE2 (0x0A): what livelybot robot::send_get_motor_
#             state_cmd() itself uses when the board reports fun_v >= 4. The
#             Mini-Pi board reports fun_v = 5 (v4.8.8, motors 4.7.3). Replies
#             also carry each motor's fault code.
#   "state"   MODE_MOTOR_STATE (0x06): the older query.
#   "none"    disabled (feedback only as the reply to live commands, and
#             readiness can never pass).
hightorque:
  feedback_query: "state2"
  feedback_query_period_s: 0.002

# Evidence: yesense_driver.cpp advertises "imu/data"; joy.yaml publishes
# geometry_msgs/Twist on "cmd_vel"; joy_node publishes sensor_msgs/Joy on "joy".
imu_topic: "/imu/data"
joy_topic: "/joy"
cmd_vel_topic: "/cmd_vel"

# --- gamepad -----------------------------------------------------------------
# SOURCE-VERIFIED against install/share/sim2real_master/joy.yaml, which is the
# HighTorque teleop configuration this robot already shipped with:
#
#   teleop.walk.axis_mappings:  axis 1 -> linear.x, axis 0 -> linear.y,
#                               axis 3 -> angular.z, all scale 1.0
#   mode_change names them:     l_vertical, l_horizontal, r_horizontal
#
# So: LEFT stick translates, RIGHT stick yaws. The F710/xbox +1 directions are
# stick-up and stick-left, which are already REP-103's +x (forward), +y (left)
# and +yaw (counter-clockwise) -- no sign flip is needed anywhere.
#
# Buttons are not listed here: joy.yaml's table is 0..10 =
# a,b,x,y,lb,rb,back,start,center,L,R, which is exactly InputManager::Config's
# built-in default.
joy:
  axis_vx: 1        # left stick vertical
  axis_vy: 0        # left stick horizontal
  axis_dyaw: 3      # right stick horizontal
  # The ONLY deadzone in the path. joy_node has its own `deadzone` param and
  # it rescales the remaining travel to full scale exactly as this does, so
  # the two would compose, not agree: 0.05 in both places means an effective
  # 0.05 + 0.05 * (1 - 0.05) = 0.0975 with a badly squashed low end. The
  # launch file therefore sets the driver's to 0.0 and leaves it here, where
  # it also covers /joy coming from a rosbag replay or a test publisher.
  deadzone: 0.05
  # A /joy sample older than this is ignored. joy_node only publishes on change
  # unless `autorepeat_rate` is set, which the launch file does.
  timeout_s: 0.5
  # What a full stick deflection means is NOT set here: the command ranges
  # belong to the selected policy package (RLPolicyRunner::operatorEnvelope, e.g. v0's
  # commands.base_velocity.ranges) and are applied by main() at startup.

# --- keyboard ----------------------------------------------------------------
# The controller's OWN raw-stdin reader, so one terminal can drive both the FSM
# and the velocity command. It starts only when this process owns an
# interactive foreground terminal, so leaving `enable: true` is safe for
# scripted, piped and backgrounded runs -- there it simply does not start and
# /joy and /cmd_vel are unaffected.
#
# This does NOT replace teleop_twist_keyboard. That node still works exactly as
# before through /cmd_vel; it just cannot drive FSM transitions, because
# geometry_msgs/Twist has no field for them. Which is why this exists.
#
# Locomotion keys are teleop_twist_keyboard's own, preserved letter for letter,
# so a key means the same thing whichever keyboard path is in use. The FSM keys
# are new: nothing in this package defined any before.
keyboard:
  enable: true
  # The magnitude one locomotion key commands is NOT set here either: it is the
  # selected policy package's `operator.keyboard.{linear_step, yaw_step}`.
  keys:
    forward: "i"
    backward: ","
    left: "J"        # strafe left  (shift+j, as in teleop_twist_keyboard)
    right: "L"       # strafe right (shift+l)
    yaw_left: "j"
    yaw_right: "l"
    stop: "k"        # zero the velocity command and release the source
    passive: "1"
    stand: "2"
    rl: "3"
    reset: "0"       # clear a latched safety fault (same as RB+Y)

# Feedback freshness thresholds are NOT here: they live in config/safety.yaml
# and main() hands them to HighTorqueHardware, so the hardware layer and
# Safety always judge staleness by the same numbers.

# Firmware-side per-motor watchdog, in ms. 0 leaves the SDK default alone.
# livelybot_serial::robot has set_timeout() but its own call is commented out
# in robot.cc, so nothing is changed unless this is set deliberately.
motor_watchdog_ms: 0
